{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Pixelmon Adventures</title>
<meta name="description" content="Digite seu nickname para entrar na loja do Pixelmon Adventures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="gate-body with-runner">

<div class="bg-layer" aria-hidden="true">
  <div class="stars"></div>
  <div class="glow glow--blue"></div>
  <div class="glow glow--indigo"></div>
</div>

<div class="gate-floaters" aria-hidden="true">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" class="gate-creature gate-creature--1" alt="">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" class="gate-creature gate-creature--2" alt="">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" class="gate-creature gate-creature--3" alt="">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" class="gate-creature gate-creature--4" alt="">
</div>

<main class="gate">
  <div class="gate__card">
    <span class="gate__eyebrow">Bem-vindo(a), treinador(a)</span>
    <h1 class="gate__title">PIXELMON<br><b>ADVENTURES</b></h1>
    <p class="gate__subtitle">Digite seu nickname do Minecraft para entrar na loja e ver ofertas feitas para você.</p>

    <form method="post" class="gate__form" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="nickname" class="gate__label">Seu nickname</label>
      <div class="gate__input-wrap">
        <img src="{% static 'img/icons/pokeball.svg' %}" class="gate__input-icon" alt="" aria-hidden="true">
        <input
          type="text" id="nickname" name="nickname" maxlength="16" minlength="3"
          placeholder="Ex: SeuNick123" autocomplete="off" autofocus required
          pattern="[A-Za-z0-9_]{3,16}">
      </div>
      {% if error %}<p class="gate__error">⚠ {{ error }}</p>{% endif %}
      <button type="submit" class="btn btn--primary btn--block btn--gate">Entrar no servidor ➜</button>
    </form>
  </div>
</main>

{% include "partials/pokemon_runner_band.html" %}

<script src="{% static 'js/main.js' %}" data-gate="1"></script>
</body>
</html>
