<article class="product-card rarity-{{ product.rarity|lower }}">
  <div class="product-card__top">
    {% if product.category.slug == 'vips' and product.name == 'Adventure' %}
      <span class="product-card__badge">Mais Popular</span>
    {% endif %}
  </div>

  <a href="{{ product.get_absolute_url }}" class="product-card__visual">
    <span class="product-card__icon">{{ product.icon }}</span>
  </a>

  <div class="product-card__body">
    <a href="{{ product.get_absolute_url }}" class="product-card__name">{{ product.name }}</a>
    <p class="product-card__desc">{{ product.short_description }}</p>
  </div>

  <div class="product-card__footer">
    <div class="product-card__price">
      {% if product.original_price %}<span class="price-original">R$ {{ product.original_price }}</span>{% endif %}
      <span class="price-current">R$ {{ product.price }}</span>
    </div>
    <form class="add-to-cart-form" data-product-name="{{ product.name }}" action="{% url 'store:cart_add' product.id %}" method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn--buy"><span>Adicionar</span></button>
    </form>
  </div>
</article>
