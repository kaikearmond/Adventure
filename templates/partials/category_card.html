<a href="{{ category.get_absolute_url }}" class="category-card" style="--cat-accent: {{ category.accent }};">
  <span class="category-card__icon">{{ category.icon }}</span>
  <span class="category-card__name">{{ category.name }}</span>
  <span class="category-card__tagline">{{ category.tagline }}</span>
  <span class="category-card__count">{{ category.product_count }} itens</span>
  <span class="category-card__cta">Explorar →</span>
</a>
