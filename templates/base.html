{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pixelmon Adventures — Loja Oficial{% endblock %}</title>
<meta name="description" content="Loja oficial do servidor Pixelmon Adventures: VIPs e tags exclusivas com pagamento seguro via Mercado Pago.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%230B0E14%22/><rect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 fill=%22%237CD84A%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">

<div class="bg-layer" aria-hidden="true">
  <div class="stars"></div>
  <div class="glow glow--blue"></div>
  <div class="glow glow--indigo"></div>
</div>

{% include "partials/navbar.html" %}

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

{% if messages %}
  <div class="hidden-messages" hidden>
    {% for message in messages %}
      <span data-toast="{{ message }}" data-tag="{{ message.tags|default:'info' }}"></span>
    {% endfor %}
  </div>
{% endif %}

<main>
{% block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}

<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
